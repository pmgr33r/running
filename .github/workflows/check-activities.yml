name: Check Activity
on:
  repository_dispatch:
    types: [run-logged]
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  check:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v5
      
      - name: Write status
        env:
          RUN_DISTANCE: ${{ github.event.client_payload.distance }}
        run: |
          mkdir -p data
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg now "$NOW" \
            --arg distance "$RUN_DISTANCE" \
            '{activity_logged: true,  checked_at: $now, distance: $distance}' \
            > date/status.json
          cat data/status.json
          
      - name: Deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          git diff --cached --quiet || git commit -m "Update activity status"
          git push
